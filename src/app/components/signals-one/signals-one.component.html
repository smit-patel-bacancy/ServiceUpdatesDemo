<div class="signals-one p-3">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-transparent border-0">
      <h4 class="mb-0 text-primary"><i class="fas fa-signal me-2"></i>Signals One</h4>
    </div>
    <div class="card-body">
      <div class="counter-section mb-4">
        <h5 class="text-primary mb-3"><i class="fas fa-calculator me-2"></i>Counter Signal</h5>
        <div class="text-center mb-4">
          <div class="display-1 text-primary mb-2">{{ count() }}</div>
          <div class="text-muted mb-3">Current Count</div>
          <div class="h4 text-primary-50">Double: {{ doubleCount() }}</div>
        </div>
        <div class="d-flex gap-3">
          <button (click)="decrement()" class="btn btn-primary flex-grow-1 py-3">
            <i class="fas fa-minus-circle me-2"></i>Decrement
          </button>
          <button (click)="increment()" class="btn btn-primary flex-grow-1 py-3">
            <i class="fas fa-plus-circle me-2"></i>Increment
          </button>
        </div>
      </div>

      <div class="user-section">
        <h5 class="text-primary mb-3"><i class="fas fa-user me-2"></i>User Signal</h5>
        <div class="card bg-light">
          <div class="card-body">
            <div class="d-flex align-items-center mb-2">
              <i class="fas fa-user-circle text-primary me-2"></i>
              <span class="text-muted">Name:</span>
              <span class="ms-2">{{ user().name }}</span>
            </div>
            <div class="d-flex align-items-center">
              <i class="fas fa-birthday-cake text-primary me-2"></i>
              <span class="text-muted">Age:</span>
              <span class="ms-2">{{ user().age }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
